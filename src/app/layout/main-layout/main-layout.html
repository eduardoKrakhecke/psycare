<div class="shell">
  <aside class="sidebar">
    <div class="logo"><i class="pi pi-heart"></i><span>PsyCare</span></div>
    <p class="section-label">GESTÃO DA CLÍNICA</p>
    <a routerLink="/dashboard" routerLinkActive="selected">
      <i class="pi pi-home"></i> Painel principal
    </a>
    <div class="upcoming">
      <i class="pi pi-calendar-clock"></i>
      <span>Agenda, pacientes e profissionais serão implementados nas próximas etapas.</span>
    </div>
    <div class="sidebar-bottom">PsyCare • Versão inicial</div>
  </aside>

  <div class="content">
    <header class="topbar">
      <span class="topbar-title">Sistema de gestão psicológica</span>
      <div class="top-actions">
        <button type="button" class="icon-button" (click)="toggleTheme()" aria-label="Alternar tema">
          <i [class]="dark() ? 'pi pi-sun' : 'pi pi-moon'"></i>
        </button>
        <span class="user-email">{{ authService.currentUser()?.email }}</span>
        <button type="button" class="logout-button" (click)="logout()">
          <i class="pi pi-sign-out"></i> Sair
        </button>
      </div>
    </header>
    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
